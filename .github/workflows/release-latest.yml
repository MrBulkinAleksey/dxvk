name: Release (latest)

# Builds the Windows DLLs with MinGW and publishes them as the rolling "latest" release,
# so the FusionFix CI can fetch the current d3d9.dll from a fixed URL.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel

    steps:
    - name: Setup container
      run: |
        pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Build release
      run: |
        VERSION_NAME="$(git describe --tags --always)"
        ./package-release.sh "${VERSION_NAME}" build --no-package
        cd build
        tar -czf dxvk-latest.tar.gz "dxvk-${VERSION_NAME}"
        echo "${VERSION_NAME}" > version.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-latest
        path: |
          build/dxvk-latest.tar.gz
          build/version.txt
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        name: dxvk-latest

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        VERSION_NAME="$(cat version.txt)"
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest dxvk-latest.tar.gz \
          --target "${GITHUB_SHA}" \
          --title "DXVK ${VERSION_NAME}" \
          --notes "Built from ${GITHUB_SHA} (${VERSION_NAME})."
